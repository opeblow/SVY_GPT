services:
  - type: web
    name: svy-gpt
    env: python
    region: oregon
    plan: free
    pythonVersion: "3.12.7"          # LOCKED FOREVER – NO MORE 3.13
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT --workers 1
    autoDeploy: true

    envVars:
      - key: OPENAI_API_KEY
        sync: false   # you’ll paste it in dashboard
      - key: PYTHONUNBUFFERED
        value: "1"
        